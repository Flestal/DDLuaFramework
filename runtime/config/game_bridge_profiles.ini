# Observed calling convention for the current build. These are reverse-
# engineered contracts, not stable public APIs.
# named_effect_dispatch: RCX=battle, RDX=source/trinket-id, R8=performer, R9=primary-target
# resolved_effect_apply:  RCX=battle, RDX=performer, R8=target, R9=resolved-effect-definition
# burn_dot_tick:          RCX=battle, RDX=actor
# battle_state_transition: RCX=battle+0x4898, EDX=next state
